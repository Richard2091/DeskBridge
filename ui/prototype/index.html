<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DeskBridge 界面原型</title>
<!--
  任务 27：可交互的界面原型（不接后端）。用浏览器直接打开即可。
  左侧是产品窗口，右侧是原型控制台：切换主题、明暗、窗口尺寸、场景和控制权状态，或跳到某个流程。
  地址参数（便于截图）：?theme=clean|mono|soft&mode=light|dark&size=desktop|narrow|phone&scenario=…&control=…&proto=closed，
  页面用 # 路由，例如 #/devices/win-pc/cmd、#/settings/appearance、#/welcome。
-->
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="stage"><div class="app" id="app"></div></div>
<aside class="proto" id="proto"></aside>
<script>
  // 原型自检：脚本出错时在页面左上角显示，便于发现问题
  window.addEventListener("error", e => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;left:8px;top:8px;z-index:999;background:#dc2626;color:#fff;padding:6px 10px;border-radius:6px;font:12px monospace;max-width:60vw";
    d.textContent = "脚本错误：" + e.message + "（" + (e.filename || "").split("/").pop() + ":" + e.lineno + "）";
    document.body.appendChild(d);
  });
</script>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/devices.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
